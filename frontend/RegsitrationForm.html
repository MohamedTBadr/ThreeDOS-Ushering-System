<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Council Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/Registration.css">
</head>
<body>

<div class="container" id="formContainer">
    <h2>Student Council Registration</h2>

    <form id="registrationForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" id="name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" id="phone" required>
        </div>

        <div class="form-group">
            <label>College</label>
            <input type="text" name="college" id="college" required>
        </div>

        <div class="form-group">
            <label>Level</label>
            <select name="level" id="level" required>
                <option value="" selected disabled>Select level</option>
                <option>Level 1</option>
                <option>Level 2</option>
                <option>Level 3</option>
                <option>Level 4</option>
            </select>
        </div>

        <div class="form-group">
            <label>Preferences</label>
            <select name="preferences" id="preferences" required>
                <option value="" selected disabled>Select preferences</option>
                <option value="1">Backend Development</option>
                <option value="2">Frontend Development</option>
                <option value="3">Marketing</option>
                <option value="4">CEO</option>
                <option value="5">Stock</option>
            </select>
        </div>
        <button type="submit">Submit Registration</button>
    </form>

    <div class="thank-you" id="thankYou">
        <h3>Thank You 🎉</h3>
        <p>Your registration has been received successfully.<br>
        We will contact you soon.</p>
    </div>

    <footer>
        © Student Council
    </footer>
</div>

<script>
    const form = document.getElementById('registrationForm');
    const thankYou = document.getElementById('thankYou');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        // Disable submit button
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        // Preference ( Name)
        const council = document.getElementById('preferences').value;
      
     

        // Build payload
        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            college: document.getElementById('college').value,
            level: document.getElementById('level').value,

            council: council,
            
        };

        try {
            const response = await fetch('../backend/api.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (result.status === 'success') {
                form.style.display = 'none';
                thankYou.style.display = 'block';
            } else {
                alert('Error: ' + result.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Registration';
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Failed to submit registration. Please try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Registration';
        }
    });
</script>


</body>
</html>
