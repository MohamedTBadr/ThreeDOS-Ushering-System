<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applicant Details</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter', sans-serif; background: linear-gradient(135deg,#19191C 0%,#252429 100%); color:#F4F4F4; min-height:100vh; }
.dashboard-container { display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
.sidebar { background: linear-gradient(180deg,#252429 0%,#19191C 100%); border-right:1px solid #565657; padding:2rem 1.5rem; display:flex; flex-direction:column; gap:2rem; position:sticky; top:0; height:100vh; overflow-y:auto; }
.logo h2 { font-size:1.5rem; font-weight:700; background: linear-gradient(135deg,#9A6BB2,#7F4797); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.nav-menu { display:flex; flex-direction:column; gap:0.5rem; }
.nav-item { display:flex; align-items:center; gap:0.75rem; padding:0.875rem 1rem; border-radius:0.75rem; color:#B0B0B0; text-decoration:none; transition:all 0.3s ease; font-weight:500; }
.nav-item:hover { background: rgba(127,71,151,0.15); color:#9A6BB2; transform:translateX(4px); }
.nav-item.active { background: rgba(127,71,151,0.25); color:#9A6BB2; border-left:3px solid #7F4797; }
.nav-item .icon { font-size:1.25rem; }
.main-content { padding:2rem; max-width:1000px; margin:0 auto; }
.header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:2rem; }
.header h1 { font-size:2rem; font-weight:700; color:#F4F4F4; }
.details-card { background: linear-gradient(135deg,#252429,#19191C); border:1px solid #565657; border-radius:1rem; padding:2rem; display:flex; flex-direction:column; gap:1rem; }
.details-row { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
.details-row label { font-weight:600; color:#B0B0B0; min-width:120px; }
.details-row span, .details-row input, .details-row select, .details-row textarea { flex:1; color:#F4F4F4; background:#19191C; border:1px solid #565657; border-radius:0.5rem; padding:0.5rem 0.75rem; }
.details-row input:disabled, .details-row select:disabled, .details-row textarea:disabled { background:transparent; border:none; color:#F4F4F4; }
button { padding:0.5rem 1rem; border-radius:0.75rem; font-weight:600; cursor:pointer; border:none; transition: all 0.3s ease; }
.btn-edit { background: rgba(127,71,151,0.15); border:1px solid #7F4797; color:#9A6BB2; }
.btn-edit:hover { background:#7F4797; color:#fff; box-shadow:0 6px 18px rgba(127,71,151,0.4); transform:translateY(-2px); }
.btn-primary { background: linear-gradient(135deg,#7F4797,#6A3A82); color:#fff; }
.btn-primary:hover { box-shadow:0 10px 24px rgba(127,71,151,0.45); transform:translateY(-2px); }
.btn-secondary { background:#252429; color:#B0B0B0; border:1px solid #565657; }
.btn-secondary:hover { background:#343338; }
@media(max-width:640px){.details-row{flex-direction:column;align-items:flex-start;} .details-row label{min-width:auto;}}
</style>
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar">
        <div class="logo"><h2>🎓 Ushering</h2></div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item"><span class="icon">👥</span> <span>Applicants</span></a>
            <a href="statistics.html" class="nav-item"><span class="icon">📊</span> <span>Statistics</span></a>
        </nav>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1>Applicant Details</h1>
            <button class="btn-edit" id="edit-toggle">Edit Mode</button>
        </header>
        <div class="details-card" id="details-card">
            <div class="details-row"><label>Name:</label><input type="text" id="applicant-name" disabled></div>
            <div class="details-row"><label>Email:</label><input type="email" id="applicant-email" disabled></div>
            <div class="details-row"><label>Phone:</label><input type="tel" id="applicant-phone" disabled></div>
            <div class="details-row"><label>College:</label><input type="text" id="applicant-college" disabled></div>
            <div class="details-row"><label>Level:</label><select id="applicant-level" disabled><option value="Level 1">Level 1</option><option value="Level 2">Level 2</option><option value="Level 3">Level 3</option><option value="Level 4">Level 4</option></select></div>
            <div class="details-row"><label>Preferences:</label><textarea id="applicant-preferences" rows="3" disabled></textarea></div>
            <div class="details-row"><label>Rating:</label><select id="applicant-rating" disabled><option value="Pending">Pending</option><option value="Acceptance">Acceptance</option><option value="B">B (Backup)</option><option value="Rejection">Rejection</option></select></div>
            <div class="details-row"><label>Notes:</label><textarea id="applicant-notes" rows="4" disabled></textarea></div>
            <div class="details-row" style="justify-content:flex-end; gap:1rem; margin-top:1rem;">
                <button class="btn-secondary" id="cancel-btn" style="display:none;">Cancel</button>
                <button class="btn-primary" id="save-btn" style="display:none;">Save Changes</button>
            </div>
        </div>
    </main>
</div>
<script>
const API_URL = '../backend/api.php';
const TOKEN = localStorage.getItem('usher_token');
if(!TOKEN) window.location.href='login.html';
const urlParams = new URLSearchParams(window.location.search);
const applicantId = urlParams.get('id');
const nameInput = document.getElementById('applicant-name');
const emailInput = document.getElementById('applicant-email');
const phoneInput = document.getElementById('applicant-phone');
const collegeInput = document.getElementById('applicant-college');
const levelSelect = document.getElementById('applicant-level');
const preferencesTextarea = document.getElementById('applicant-preferences');
const ratingSelect = document.getElementById('applicant-rating');
const notesTextarea = document.getElementById('applicant-notes');
const editBtn = document.getElementById('edit-toggle');
const saveBtn = document.getElementById('save-btn');
const cancelBtn = document.getElementById('cancel-btn');
let originalData = {};

async function loadApplicant(){
    try{
        const response = await fetch(`${API_URL}?id=${applicantId}`,{headers:{'X-Token':TOKEN}});
        const result = await response.json();
        if(result.status==='success'){
            const applicant = result.data.applicants.find(a=>a.id==applicantId);
            if(!applicant){alert('Applicant not found'); return;}
            nameInput.value = applicant.name || '';
            emailInput.value = applicant.email || '';
            phoneInput.value = applicant.phone || '';
            collegeInput.value = applicant.college || '';
            levelSelect.value = applicant.level || 'Level 1';
            preferencesTextarea.value = applicant.council || '';
            ratingSelect.value = applicant.rating || 'Pending';
            notesTextarea.value = applicant.notes || '';
            originalData = {...applicant};
        }
    }catch(err){alert('Failed to load applicant details');}
}

editBtn.addEventListener('click',()=>{
    [nameInput,emailInput,phoneInput,collegeInput,levelSelect,preferencesTextarea,ratingSelect,notesTextarea].forEach(el=>el.disabled=false);
    saveBtn.style.display='inline-block';
    cancelBtn.style.display='inline-block';
    editBtn.style.display='none';
});
cancelBtn.addEventListener('click',()=>{ loadApplicant(); [nameInput,emailInput,phoneInput,collegeInput,levelSelect,preferencesTextarea,ratingSelect,notesTextarea].forEach(el=>el.disabled=true); saveBtn.style.display='none'; cancelBtn.style.display='none'; editBtn.style.display='inline-block'; });
saveBtn.addEventListener('click', async ()=>{
    const data = { id: parseInt(applicantId), name:nameInput.value, email:emailInput.value, phone:phoneInput.value, college:collegeInput.value, level:levelSelect.value, preferences:preferencesTextarea.value, rating:ratingSelect.value, notes:notesTextarea.value };
    try{
        const response = await fetch(API_URL,{ method:'PATCH', headers:{'Content-Type':'application/json','X-Token':TOKEN}, body:JSON.stringify(data) });
        const result = await response.json();
        if(result.status==='success'){ alert('Updated successfully'); loadApplicant(); [nameInput,emailInput,phoneInput,collegeInput,levelSelect,preferencesTextarea,ratingSelect,notesTextarea].forEach(el=>el.disabled=true); saveBtn.style.display='none'; cancelBtn.style.display='none'; editBtn.style.display='inline-block';}
        else alert(result.message);
    }catch(err){alert('Failed to update');}
});

document.addEventListener('DOMContentLoaded', loadApplicant);
</script>
</body>
</html>
