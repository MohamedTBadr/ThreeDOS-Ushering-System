<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreeDOS Applicant Details - Interview Schedule</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" type="image/png" href="./img/ThreeDOS.jpg">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: #0F0F12;
    color: #F4F4F4;
    min-height: 100vh;
}

.dashboard-container {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
}

/* ===== Sidebar ===== */
.sidebar {
    background: linear-gradient(180deg, #1A1A1E 0%, #0F0F12 100%);
    border-right: 1px solid #2D2D32;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    position: sticky;
    top: 0;
    height: 100vh;
}

.logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #9A6BB2, #7F4797);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo h2 {
    font-size: 1.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, #9A6BB2, #7F4797);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.nav-menu {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.875rem 1rem;
    border-radius: 0.75rem;
    color: #A0A0A8;
    text-decoration: none;
    transition: all 0.3s ease;
    font-weight: 500;
}

.nav-item:hover {
    background: rgba(127, 71, 151, 0.1);
    color: #D0A8E8;
}

.nav-item.active {
    background: rgba(127, 71, 151, 0.2);
    color: #9A6BB2;
    border-left: 3px solid #7F4797;
}

.nav-item i {
    width: 20px;
    text-align: center;
}

.user-profile {
    margin-top: auto;
    padding-top: 1.5rem;
    border-top: 1px solid #2D2D32;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7F4797, #9A6BB2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
}

.user-info h4 {
    font-size: 0.9rem;
    font-weight: 600;
}

.user-info p {
    font-size: 0.8rem;
    color: #A0A0A8;
}

/* ===== Main Content ===== */
.main-content {
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
}

/* ===== Header ===== */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
}

.header-left h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
}

.header-left p {
    color: #A0A0A8;
    font-size: 0.95rem;
}

.header-actions {
    display: flex;
    gap: 0.75rem;
}

/* ===== Applicant Card ===== */
.applicant-card {
    background: #1A1A1E;
    border-radius: 1rem;
    border: 1px solid #2D2D32;
    overflow: hidden;
    margin-bottom: 2rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.card-header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid #2D2D32;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(26, 26, 30, 0.8);
}

.card-header h2 {
    font-size: 1.5rem;
    font-weight: 600;
}

.status-badge {
    padding: 0.4rem 1rem;
    border-radius: 2rem;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
}

.status-pending {
    background: rgba(255, 193, 7, 0.15);
    color: #FFC107;
    border: 1px solid rgba(255, 193, 7, 0.3);
}

.status-accepted {
    background: rgba(40, 167, 69, 0.15);
    color: #28A745;
    border: 1px solid rgba(40, 167, 69, 0.3);
}

.status-rejected {
    background: rgba(220, 53, 69, 0.15);
    color: #DC3545;
    border: 1px solid rgba(220, 53, 69, 0.3);
}

.status-backup {
    background: rgba(0, 123, 255, 0.15);
    color: #007BFF;
    border: 1px solid rgba(0, 123, 255, 0.3);
}

.card-body {
    padding: 2rem;
}

.details-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.detail-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.detail-group label {
    font-size: 0.85rem;
    font-weight: 600;
    color: #A0A0A8;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.detail-group input,
.detail-group select,
.detail-group textarea {
    background: #0F0F12;
    border: 1px solid #3A3A40;
    border-radius: 0.75rem;
    padding: 0.875rem 1rem;
    color: #F4F4F4;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s ease;
}

.detail-group input:focus,
.detail-group select:focus,
.detail-group textarea:focus {
    outline: none;
    border-color: #7F4797;
    box-shadow: 0 0 0 3px rgba(127, 71, 151, 0.2);
}

.detail-group input:disabled,
.detail-group select:disabled,
.detail-group textarea:disabled {
    background: transparent;
    border: 1px solid transparent;
    color: #F4F4F4;
}

.interview-section {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid #2D2D32;
}

.interview-section h3 {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.interview-time-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
}

.time-display {
    background: rgba(127, 71, 151, 0.1);
    padding: 0.75rem 1.25rem;
    border-radius: 0.75rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

/* ===== Action Bar ===== */
.action-bar {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    padding: 1.5rem 2rem;
    border-top: 1px solid #2D2D32;
    background: rgba(26, 26, 30, 0.8);
}

/* ===== Buttons ===== */
.btn {
    padding: 0.75rem 1.5rem;
    border-radius: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.3s ease;
    font-size: 0.95rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
}

.btn-edit {
    background: rgba(127, 71, 151, 0.15);
    border: 1px solid #7F4797;
    color: #D0A8E8;
}

.btn-edit:hover {
    background: #7F4797;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(127, 71, 151, 0.3);
}

.btn-primary {
    background: linear-gradient(135deg, #7F4797, #9A6BB2);
    color: #fff;
}

.btn-primary:hover {
    background: linear-gradient(135deg, #9A6BB2, #7F4797);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(127, 71, 151, 0.4);
}

.btn-secondary {
    background: transparent;
    color: #A0A0A8;
    border: 1px solid #3A3A40;
}

.btn-secondary:hover {
    background: #2D2D32;
    color: #F4F4F4;
}

.btn-danger {
    background: rgba(220, 53, 69, 0.15);
    color: #F18A94;
    border: 1px solid rgba(220, 53, 69, 0.3);
}

.btn-danger:hover {
    background: rgba(220, 53, 69, 0.3);
    color: #fff;
}

.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
}

/* ===== Toast Notification ===== */
.toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: #1A1A1E;
    border: 1px solid #2D2D32;
    border-left: 4px solid #28A745;
    border-radius: 0.75rem;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.4s ease;
    z-index: 1000;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

.toast-error {
    border-left-color: #DC3545;
}

/* ===== Responsive Design ===== */
@media (max-width: 1024px) {
    .details-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 768px) {
    .dashboard-container {
        grid-template-columns: 1fr;
    }
    
    .sidebar {
        display: none;
    }
    
    .main-content {
        padding: 1.5rem;
    }
    
    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
    }
    
    .interview-time-container {
        grid-template-columns: 1fr;
    }
    
    .action-bar {
        flex-direction: column;
    }
    
    .action-bar .btn {
        width: 100%;
        justify-content: center;
    }
}

/* ===== Loading State ===== */
.loading-shimmer {
    background: linear-gradient(90deg, #1A1A1E 25%, #2D2D32 50%, #1A1A1E 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 0.5rem;
    height: 20px;
}

@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

/* ===== Utility Classes ===== */
.hidden {
    display: none !important;
}

.text-muted {
    color: #A0A0A8;
}

.icon-sm {
    font-size: 0.9rem;
}
</style>
</head>

<body>
<div class="dashboard-container">

  <!-- Sidebar -->
  <aside class="sidebar"> 
    <div class="logo"> 
      <h2>ThreeDOS'26</h2>
    </div> 
    <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item active" data-view="applicants"> 
            <span class="icon">👥</span> <span>Applicants</span> </a> 
        <a href="statistics_page.html" class="nav-item" data-view="statistics"> 
            <span class="icon">📊</span> <span>Statistics</span> </a> 
        <a href="RegistrationForm.html" class="nav-item"> 
            <span class="icon">➕</span> <span>New Registration</span> </a> 
    </nav>
  </aside> 

  <main class="main-content">
      <header class="header">
          <div class="header-left">
              <h1>Applicant Details</h1>
              <p>View and manage applicant information</p>
          </div>
          
          <div class="header-actions">
              <button class="btn btn-secondary" onclick="window.history.back()">
                  <i class="fas fa-arrow-left"></i>
                  Back
              </button>
              <button class="btn btn-edit" id="edit-toggle">
                  <i class="fas fa-edit"></i>
                  Edit Details
              </button>
          </div>
      </header>

      <div class="applicant-card">
          <div class="card-header">
              <h2 id="applicant-name-display">Loading...</h2>
              <span class="status-badge status-pending" id="applicant-status">
                  <i class="fas fa-clock"></i>
                  <span>Pending</span>
              </span>
          </div>
          
          <div class="card-body">
              <div class="details-grid">
                  <div class="detail-group">
                      <label for="applicant-name">
                          <i class="fas fa-user"></i>
                          Full Name
                      </label>
                      <input type="text" id="applicant-name" placeholder="Enter full name" disabled>
                  </div>
                  
                  <div class="detail-group">
                      <label for="applicant-email">
                          <i class="fas fa-envelope"></i>
                          Email Address
                      </label>
                      <input type="email" id="applicant-email" placeholder="Enter email address" disabled>
                  </div>
                  
                  <div class="detail-group">
                      <label for="applicant-phone">
                          <i class="fas fa-phone"></i>
                          Phone Number
                      </label>
                      <input type="tel" id="applicant-phone" placeholder="Enter phone number" disabled>
                  </div>
                  
                  <div class="detail-group">
                      <label for="applicant-college">
                          <i class="fas fa-university"></i>
                          College
                      </label>
                      <input type="text" id="applicant-college" placeholder="Enter college name" disabled>
                  </div>

                  <div class="detail-group">
                      <label for="applicant-level">
                          <i class="fas fa-layer-group"></i>
                          Academic Level
                      </label>
                      <select id="applicant-level" disabled>
                          <option value="">Select level</option>
                          <option value="Level 1">Level 1</option>
                          <option value="Level 2">Level 2</option>
                          <option value="Level 3">Level 3</option>
                          <option value="Level 4">Level 4</option>
                      </select>
                  </div>

                  <div class="detail-group">
                      <label for="applicant-rating">
                          <i class="fas fa-star"></i>
                          Rating & Status
                      </label>
                      <select id="applicant-rating" disabled>
                          <option value="Pending">Pending Review</option>
                          <option value="Acceptance">Accepted</option>
                          <option value="Backup Candidate">Backup Candidate</option>
                          <option value="Rejection">Rejected</option>
                      </select>
                  </div>
              </div>

              <!-- Interview Section -->
              <div class="interview-section">
                  <h3>
                      <i class="fas fa-calendar-check"></i>
                      Interview Schedule
                  </h3>

                  <div class="interview-time-container">
                      <!-- Interviewer Name -->
                      <div class="detail-group">
                          <label for="interviewer">
                              <i class="fas fa-user"></i>
                              Interviewer Name
                          </label>
                          <input type="text" id="interviewer" disabled>
                      </div>

                      <!-- Interview Time -->
                      <div class="detail-group">
                          <label for="interview-time">
                              <i class="fas fa-clock"></i>
                              Scheduled Time
                          </label>
                          <input type="datetime-local" id="interview-time" disabled>
                      </div>

                      <div class="time-display hidden" id="time-display">
                          <i class="fas fa-calendar-alt"></i>
                          <span id="formatted-time">Not scheduled</span>
                      </div>
                  </div>
              </div>

              <!-- Notes Section -->
              <div class="interview-section">
                  <h3>
                      <i class="fas fa-sticky-note"></i>
                      Internal Notes
                  </h3>

                  <div class="detail-group">
                      <label for="applicant-notes">
                          <i class="fas fa-pen"></i>
                          Notes
                      </label>
                      <textarea id="applicant-notes"
                                rows="4"
                                placeholder="Write internal notes about the applicant..."
                                disabled
                                style="background:#0F0F12;border:1px solid #3A3A40;border-radius:0.75rem;padding:1rem;color:#F4F4F4;resize:vertical;"></textarea>
                  </div>
              </div>
          </div>

          <div class="action-bar hidden" id="action-bar">
              <button class="btn btn-danger" id="cancel-btn">
                  <i class="fas fa-times"></i>
                  Cancel
              </button>
              <button class="btn btn-primary" id="save-btn">
                  <i class="fas fa-save"></i>
                  Save Changes
              </button>
          </div>
      </div>
      
      <div class="toast" id="toast">
          <i class="fas fa-check-circle"></i>
          <span id="toast-message">Changes saved successfully!</span>
      </div>
  </main>
</div>

<script>
const API_URL = '../backend/api.php';
const TOKEN = localStorage.getItem('usher_token');
if(!TOKEN) window.location.href='login.html';

const applicantId = new URLSearchParams(window.location.search).get('id');

// DOM Elements
const nameInput = document.getElementById('applicant-name');
const emailInput = document.getElementById('applicant-email');
const phoneInput = document.getElementById('applicant-phone');
const ratingSelect = document.getElementById('applicant-rating');
const interviewerInput=document.getElementById('interviewer');
const interviewTimeInput = document.getElementById('interview-time');
const nameDisplay = document.getElementById('applicant-name-display');
const statusBadge = document.getElementById('applicant-status');
const timeDisplay = document.getElementById('time-display');
const formattedTime = document.getElementById('formatted-time');
const collegeInput = document.getElementById('applicant-college');
const levelSelect  = document.getElementById('applicant-level');
const notesInput   = document.getElementById('applicant-notes');


// Buttons
const editBtn = document.getElementById('edit-toggle');
const saveBtn = document.getElementById('save-btn');
const cancelBtn = document.getElementById('cancel-btn');
const actionBar = document.getElementById('action-bar');
const toast = document.getElementById('toast');
const toastMessage = document.getElementById('toast-message');

// Status badge classes
const statusClasses = {
    'Pending': 'status-pending',
    'Acceptance': 'status-accepted',
    'B': 'status-backup',
    'Rejection': 'status-rejected'
};

const statusIcons = {
    'Pending': 'fa-clock',
    'Acceptance': 'fa-check-circle',
    'B': 'fa-user-clock',
    'Rejection': 'fa-times-circle'
};

// Format date for display
function formatDateTime(dateTimeStr) {
    if (!dateTimeStr) return 'Not scheduled';
    
    const date = new Date(dateTimeStr.replace(' ', 'T'));
    return date.toLocaleString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });
}

// Show toast notification
function showToast(message, isError = false) {
    toastMessage.textContent = message;
    toast.classList.toggle('toast-error', isError);
    toast.classList.add('show');
    
    setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

// Update status badge
function updateStatusBadge(status) {
    const statusText = status === 'Acceptance' ? 'Accepted' : 
                      status === 'B' ? 'Backup' : 
                      status === 'Rejection' ? 'Rejected' : 'Pending';
    
    statusBadge.className = `status-badge ${statusClasses[status] || statusClasses.Pending}`;
    statusBadge.innerHTML = `<i class="fas ${statusIcons[status] || statusIcons.Pending}"></i><span>${statusText}</span>`;
}

// Load applicant data
async function loadApplicant() {
    try {
        const res = await fetch(`${API_URL}?id=${applicantId}`, {
            headers: { 'X-Token': TOKEN }
        });
        
        const json = await res.json();
        
        if (json.status !== 'success') {
            throw new Error('Failed to load applicant data');
        }
        
        const applicant = json.data.applicants.find(x => x.id == applicantId);
        if (!applicant) {
            throw new Error('Applicant not found');
        }
        
        // Populate form fields
        nameInput.value = applicant.name || '';
        emailInput.value = applicant.email || '';
        phoneInput.value = applicant.phone || '';
        ratingSelect.value = applicant.rating || 'Pending';
        collegeInput.value = applicant.college || '';
		levelSelect.value  = applicant.level || '';
		notesInput.value   = applicant.notes || '';
        
		//console.log(levelSelect.value);
        const interviewTime = applicant.interview_time ? 
            applicant.interview_time.replace(' ', 'T').substr(0, 16) : '';
        interviewTimeInput.value = interviewTime;
        interviewerInput.value= applicant.interviewed_by || 'NA';
        // Update display
        nameDisplay.textContent = applicant.name || 'Unnamed Applicant';
        updateStatusBadge(applicant.rating || 'Pending');
        
        // Update time display
        if (applicant.interview_time) {
            formattedTime.textContent = formatDateTime(applicant.interview_time);
            timeDisplay.classList.remove('hidden');
        } else {
            timeDisplay.classList.add('hidden');
        }
        
    } catch (error) {
        console.error('Error loading applicant:', error);
        showToast('Failed to load applicant data', true);
    }
}

// Enable edit mode
editBtn.onclick = () => {
    // Enable all inputs
[nameInput, emailInput, phoneInput, ratingSelect, interviewTimeInput,
 collegeInput, levelSelect, notesInput]
.forEach(e => e.disabled = false);

    
    // Show action bar
    actionBar.classList.remove('hidden');
    
    // Hide edit button
    editBtn.classList.add('hidden');
    
    // Hide time display when editing
    timeDisplay.classList.add('hidden');
    
    // Focus on first input
    nameInput.focus();
};

// Cancel edit mode
cancelBtn.onclick = () => {
    // Reload original data
    loadApplicant();
    
    // Disable all inputs
[nameInput, emailInput, phoneInput, ratingSelect, interviewTimeInput,
 collegeInput, levelSelect, notesInput]
.forEach(e => e.disabled = true);

    
    // Hide action bar
    actionBar.classList.add('hidden');
    
    // Show edit button
    editBtn.classList.remove('hidden');
};

// Save changes
saveBtn.onclick = async () => {
    // Validate inputs
    if (!nameInput.value.trim()) {
        showToast('Please enter a name', true);
        nameInput.focus();
        return;
    }
    
    if (!emailInput.value.trim()) {
        showToast('Please enter an email', true);
        emailInput.focus();
        return;
    }
    
    // Prepare payload
const payload = {
    id: parseInt(applicantId),
    name: nameInput.value.trim(),
    email: emailInput.value.trim(),
    phone: phoneInput.value.trim(),
    rating: ratingSelect.value,
    college: collegeInput.value.trim(),
    level: levelSelect.value,
    notes: notesInput.value.trim(),
    interviewered_by :interviewerInput.value,
    interview_time: interviewTimeInput.value
        ? interviewTimeInput.value.replace('T', ' ')
        : null
};

    
    // Show loading state
    const originalText = saveBtn.innerHTML;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    saveBtn.disabled = true;
    
    try {
        const res = await fetch(API_URL, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'X-Token': TOKEN
            },
            body: JSON.stringify(payload)
        });
        
        const json = await res.json();
        
        if (json.status === 'success') {
            showToast('Applicant details updated successfully');
            
            // Update display
            nameDisplay.textContent = payload.name;
            updateStatusBadge(payload.rating);
            
            if (payload.interview_time) {
                formattedTime.textContent = formatDateTime(payload.interview_time);
                timeDisplay.classList.remove('hidden');
            }
            
            // Exit edit mode
            cancelBtn.onclick();
        } else {
            throw new Error(json.message || 'Update failed');
        }
    } catch (error) {
        console.error('Error saving applicant:', error);
        showToast('Failed to save changes: ' + error.message, true);
    } finally {
        // Restore button state
        saveBtn.innerHTML = originalText;
        saveBtn.disabled = false;
    }
};

// Initialize page
document.addEventListener('DOMContentLoaded', () => {
    loadApplicant();
    
    // Update time display when interview time changes
    interviewTimeInput.addEventListener('change', () => {
        if (interviewTimeInput.value) {
            const date = new Date(interviewTimeInput.value);
            formattedTime.textContent = formatDateTime(date.toISOString());
            timeDisplay.classList.remove('hidden');
        } else {
            timeDisplay.classList.add('hidden');
        }
    });
    
    // Update status badge when rating changes
    ratingSelect.addEventListener('change', () => {
        updateStatusBadge(ratingSelect.value);
    });
});
</script>
