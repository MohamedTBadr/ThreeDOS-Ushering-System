<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreeDOS Interview Calendar</title>
    <link rel="icon" type="image/png" href="./img/ThreeDOS.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        /* ===============================
       CSS VARIABLES & GLOBAL ENHANCEMENTS
    =============================== */
        :root {
            --primary: #7F4797;
            --primary-light: #9B6DB0;
            --primary-dark: #693885;
            --primary-glow: rgba(127, 71, 151, 0.15);
            --secondary: #00A8FF;
            --accent: #FF6B8B;
            --success: #4CAF50;
            --warning: #FF9800;
            --dark: #0f0f13;
            --darker: #0a0a0d;
            --dark-light: #1a1a20;
            --dark-lighter: #24242b;
            --dark-lightest: #2e2e36;
            --border: #3a3a44;
            --border-light: #4a4a54;
            --text: #f8f8fa;
            --text-secondary: #b0b0c0;
            --text-tertiary: #808090;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
            --shadow-primary: 0 8px 24px rgba(127, 71, 151, 0.4);
            --glass-bg: rgba(26, 26, 32, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);

            --hour-height: 75px;
            /* 1 hour = 400px (4 * 100px) */
            --quarter-height: 75px;
            /* 15 mins = 100px requested */

        }

        /* ===============================
       CALENDAR CONTAINER - Premium Glassmorphism
    =============================== */
        .calendar-container {
            background: linear-gradient(145deg, var(--dark-light), var(--darker));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow:
                var(--shadow-lg),
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 110px);
            backdrop-filter: blur(20px) saturate(180%);
            background-blend-mode: overlay;
            position: relative;
            isolation: isolate;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .calendar-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 80%, rgba(127, 71, 151, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 168, 255, 0.05) 0%, transparent 50%);
            z-index: -1;
            opacity: 0.6;
            animation: gradientShift 15s ease-in-out infinite alternate;
        }

        .calendar-container:hover {
            box-shadow:
                var(--shadow-lg),
                0 0 60px rgba(127, 71, 151, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        @keyframes gradientShift {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 0.8;
            }
        }

        /* ===============================
       CALENDAR HEADER - Premium Gradient
    =============================== */
        .calendar-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(180deg,
                    rgba(15, 15, 19, 0.95) 0%,
                    rgba(26, 26, 32, 0.9) 100%);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .calendar-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    var(--primary) 50%,
                    transparent 100%);
            opacity: 0.5;
        }

        .calendar-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .current-period {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text);
            min-width: 240px;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, var(--text), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .current-period::after {
            content: '📅';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            opacity: 0.6;
        }

        /* ===============================
       PREMIUM BUTTONS WITH MICRO-INTERACTIONS
    =============================== */
        .btn-page,
        .btn-secondary,
        .btn-refresh {
            background: linear-gradient(145deg, var(--dark-lightest), var(--dark-lighter));
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 0.7rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                var(--shadow-sm);
        }

        .btn-page::before,
        .btn-secondary::before,
        .btn-refresh::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.1) 0%,
                    transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-page:hover::before,
        .btn-secondary:hover::before,
        .btn-refresh:hover::before {
            opacity: 1;
        }

        .btn-page:hover,
        .btn-secondary:hover,
        .btn-refresh:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            transform: translateY(-2px) scale(1.05);
            box-shadow:
                var(--shadow-primary),
                0 0 30px rgba(127, 71, 151, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: var(--primary-light);
        }

        .btn-page:active,
        .btn-secondary:active,
        .btn-refresh:active {
            transform: translateY(0) scale(0.98);
            transition-duration: 0.1s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: #fff;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            box-shadow:
                var(--shadow-primary),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.2) 0%,
                    transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-primary:hover::after {
            opacity: 1;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow:
                0 12px 32px rgba(127, 71, 151, 0.5),
                0 0 40px rgba(127, 71, 151, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
        }

        /* ===============================
       PREMIUM VIEW SWITCHER
    =============================== */
        .view-switcher {
            display: flex;
            background: var(--dark-lighter);
            padding: 0.4rem;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .view-switcher::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(127, 71, 151, 0.1) 0%,
                    transparent 50%);
        }

        .view-btn {
            padding: 0.6rem 1.5rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
            letter-spacing: 0.3px;
            min-width: 90px;
            text-align: center;
        }

        .view-btn:hover {
            color: var(--text);
            transform: translateY(-1px);
        }

        .view-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow:
                var(--shadow-primary),
                0 4px 16px rgba(0, 0, 0, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            animation: buttonPulse 2s infinite;
        }

        .view-btn.active::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            z-index: -1;
            opacity: 0.5;
            filter: blur(10px);
            animation: glowPulse 2s infinite;
        }

        @keyframes buttonPulse {

            0%,
            100% {
                box-shadow: var(--shadow-primary);
            }

            50% {
                box-shadow: 0 0 30px rgba(127, 71, 151, 0.6);
            }
        }

        @keyframes glowPulse {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.6;
            }
        }

        /* ===============================
       CALENDAR BODY - Luxury Scroll
    =============================== */
        .calendar-body {
            flex: 1;
            overflow: auto;
            position: relative;
            background: var(--dark-light);
            scroll-behavior: smooth;
        }

        .calendar-body::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        .calendar-body::-webkit-scrollbar-track {
            background: linear-gradient(to bottom, var(--dark-light), var(--dark));
            border-radius: 10px;
        }

        .calendar-body::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, var(--primary), var(--primary-dark));
            border-radius: 10px;
            border: 2px solid var(--dark-light);
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.3);
        }

        .calendar-body::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to bottom, var(--primary-light), var(--primary));
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.5);
        }

        .calendar-body::-webkit-scrollbar-corner {
            background: var(--dark);
        }

        /* ===============================
       WEEKLY GRID - Luxury Timeline
    =============================== */
        .weekly-grid {
            display: grid;
            grid-template-columns: 100px repeat(7, 1fr);
            min-width: 1400px;
            /* increased */
            height: 100%;
        }


        .grid-header {
            position: sticky;
            top: 0;
            background: linear-gradient(180deg,
                    rgba(15, 15, 19, 0.95) 0%,
                    rgba(26, 26, 32, 0.9) 100%);
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
            padding: 1.2rem 0.5rem;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border-right: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .grid-header:hover {
            background: rgba(26, 26, 32, 0.95);
        }

        .grid-header.today {
            color: var(--text);
            background: linear-gradient(180deg,
                    rgba(127, 71, 151, 0.15) 0%,
                    rgba(127, 71, 151, 0.1) 100%);
            position: relative;
            overflow: hidden;
        }

        .grid-header.today::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                    var(--primary),
                    var(--accent),
                    var(--primary));
            animation: shimmer 3s infinite linear;
        }

        .time-col {
            border-right: 1px solid var(--glass-border);
            background: linear-gradient(180deg,
                    rgba(15, 15, 19, 0.95) 0%,
                    rgba(26, 26, 32, 0.9) 100%);
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-align: center;
            text-align: center;
            /* padding-top: 0.5rem; Removed for alignment */
            position: sticky;
            left: 0;
            z-index: 90;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        .daily-grid,
        .weekly-grid {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            position: relative;
        }


        .day-col {
            border-right: 1px solid var(--glass-border);
            position: relative;
            min-height: 1440px;
            background:
                repeating-linear-gradient(to bottom,
                    transparent,
                    transparent 59px,
                    rgba(255, 255, 255, 0.03) 60px),
                linear-gradient(to bottom,
                    rgba(26, 26, 32, 0.8) 0%,
                    transparent 100%);
            transition: all 0.3s ease;
        }

        .day-col:hover {
            background:
                repeating-linear-gradient(to bottom,
                    transparent,
                    transparent 59px,
                    rgba(255, 255, 255, 0.05) 60px),
                linear-gradient(to bottom,
                    rgba(127, 71, 151, 0.05) 0%,
                    transparent 100%);
        }

        .day-col:last-child {
            border-right: none;
        }

        .hour-row {
            height: var(--quarter-height);
            /* 15px per 15-minute slot */
            border-bottom: 1px solid #eee;
            position: relative;

            transition: all 0.2s ease;
        }

        .hour-row:hover {
            background: rgba(127, 71, 151, 0.03);
            border-bottom-color: rgba(127, 71, 151, 0.3);
        }

        .hour-row.current-hour {
            background: linear-gradient(90deg,
                    rgba(127, 71, 151, 0.1),
                    transparent 30%);
            position: relative;
        }

        .hour-row.current-hour::before {
            content: '▶';
            position: absolute;
            left: 5px;
            color: var(--primary);
            font-size: 0.7rem;
            animation: blink 2s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200px 0;
            }

            100% {
                background-position: 200px 0;
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* ===============================
       PREMIUM EVENT CARD - Glassmorphism
    =============================== */
        .event-card {
            position: absolute;
            left: 8px;
            right: 8px;
            background: linear-gradient(135deg,
                    rgba(127, 71, 151, 0.9),
                    rgba(105, 56, 133, 0.9));
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.85rem;
            color: #fff;
            overflow: hidden;
            box-shadow:
                var(--shadow-md),
                0 4px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-left: 4px solid var(--primary-light);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform-origin: center;
            animation: cardFloat 3s ease-in-out infinite;
        }

        .event-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.1) 0%,
                    transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .event-card:hover::before {
            opacity: 1;
        }

        .event-card:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow:
                0 16px 40px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(127, 71, 151, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
            z-index: 100;
            animation: none;
        }

        .event-card:active {
            transform: translateY(-2px) scale(1.01);
            transition-duration: 0.1s;
        }

        @keyframes cardFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        .event-card.high-priority {
            background: linear-gradient(135deg,
                    rgba(255, 107, 139, 0.9),
                    rgba(255, 87, 119, 0.9));
            border-left-color: #FF9EB5;
        }

        .event-card.medium-priority {
            background: linear-gradient(135deg,
                    rgba(255, 152, 0, 0.9),
                    rgba(230, 137, 0, 0.9));
            border-left-color: #FFCC80;
        }

        .event-card.low-priority {
            background: linear-gradient(135deg,
                    rgba(0, 168, 255, 0.9),
                    rgba(0, 138, 225, 0.9));
            border-left-color: #80D8FF;
        }

        .event-title {
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 4px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.3px;
            position: relative;
            padding-left: 16px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            /* limit to 2 lines */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }


        .event-title::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary-light);
            font-size: 1.2rem;
            line-height: 0.8;
        }

        .event-time {
            opacity: 0.95;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.2);
            padding: 3px 8px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(5px);
        }

        /* ===============================
       DAILY GRID - Premium Layout
    =============================== */
        .daily-grid {
            display: grid;
            grid-template-columns: 120px 1fr;
            min-width: 900px;
            height: 100%;
        }


        /* ===============================
       LUXURY MODAL - Glassmorphism
    =============================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(20px) saturate(180%);
            animation: overlayFadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2rem;
        }

        @keyframes overlayFadeIn {
            from {
                opacity: 0;
                backdrop-filter: blur(0);
            }

            to {
                opacity: 1;
                backdrop-filter: blur(20px);
            }
        }

        .modal-content {
            background: linear-gradient(145deg,
                    rgba(26, 26, 32, 0.95),
                    rgba(15, 15, 19, 0.98));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            box-shadow:
                var(--shadow-lg),
                0 0 100px rgba(127, 71, 151, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: modalSlideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%,
                    rgba(127, 71, 151, 0.1) 0%,
                    transparent 50%);
            pointer-events: none;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            position: relative;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), transparent);
            border-radius: 3px;
        }

        .modal-body {
            position: relative;
            z-index: 1;
        }

        .modal-field {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .modal-field:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(127, 71, 151, 0.3);
            transform: translateX(4px);
        }

        .modal-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .modal-value {
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 700;
            word-break: break-word;
            line-height: 1.4;
        }

        .close-modal {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            font-size: 1.8rem;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
        }

        .close-modal:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            transform: rotate(90deg) scale(1.1);
            box-shadow: var(--shadow-primary);
            border-color: var(--primary);
        }

        /* ===============================
       PREMIUM LOADER
    =============================== */
        .loader-container {

            box-shadow: 0 0 20px rgba(127, 71, 151, 0.3);

        .loader::after {
            content: '';

            inset: -6px;
            border: 3px solid transparent;

        .loader-text {

        @keyframes textPulse {

            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;

        }

        /* ===============================
       RESPONSIVE ENHANCEMENTS
    =============================== */
        @media (max-width: 1400px) {

                min-width: 1100px;

        /* ===============================

    =============================== */

                        rgba(20, 20, 25, 0.98),

        /* ===============================
       PRINT OPTIMIZATIONS
    =============================== */

        /* ===============================
       ACCESSIBILITY ENHANCEMENTS
    =============================== */

       PERFORMANCE OPTIMIZATIONS
    =============================== */
        .will-change-transform {

        }

            will-change: opacity;
        }

        /* ===============================
       UTILITY CLASSES
    =============================== */
        .text-gradient {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

        .glass-effect {

            backdrop-filter: blur(10px);

                0 20px 60px rgba(0, 0, 0, 0.4),

        /* ===============================
       ANIMATION CLASSES
    =============================== */
        .fade-in {
            animation: fadeIn 0.5s ease forwards;

            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;

                opacity: 1;
                transform: translateY(0);

        /* ===============================
       LOADING STATES
    =============================== */
        .is-loading {

            content: '';

            inset: 0;

            backdrop-filter: blur(2px);
            border-radius: inherit;
            z-index: 1;

       EMPTY STATES
    =============================== */
        .empty-state {

            flex-direction: column;

        }

        /* ===============================
       DRAG & DROP STYLES
    =============================== */
        .event-card.dragging {
            opacity: 0.7;
            transform: scale(1.05) rotate(3deg);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

        .drop-target {
            background: rgba(127, 71, 151, 0.1);

        }

        /* ===============================
       TOOLTIP ENHANCEMENTS
    =============================== */
        [data-tooltip] {
            position: relative;
            cursor: help;
        }

        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark-lighter);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            pointer-events: none;
        }

        [data-tooltip]:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-8px);
        }

        /* ===============================
       FOCUS VISIBILITY
    =============================== */
        :focus-visible {
            outline: 2px solid var(--primary-light);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* ===============================
       SMOOTH TRANSITIONS
    =============================== */
        .smooth-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===============================
           GLOBAL PAGE LOADER
        =============================== */
        #global-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(135deg,
                    var(--darker) 0%,
                    var(--dark) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        #global-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .global-loader-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--dark-light);
            box-shadow:
                0 0 0 4px rgba(127, 71, 151, 0.2),
                0 0 40px rgba(127, 71, 151, 0.4);
            overflow: hidden;
            animation: logoPulse 2s infinite ease-in-out;
            position: relative;
        }

        .global-loader-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .global-loader-text {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--text);
            background: linear-gradient(90deg,
                    var(--primary-light),
                    var(--accent),
                    var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: textShimmer 3s linear infinite;
        }

        .global-loader-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .global-loader-bar::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 40%;
            background: var(--primary);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--primary);
            animation: barLoading 1.5s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 4px rgba(127, 71, 151, 0.2), 0 0 40px rgba(127, 71, 151, 0.4);
            }

                transform: scale(1.05);

        @keyframes textShimmer {

                background-position: 200% center;

        }

        @keyframes barLoading {

            }

                left: 40%;

            }

        /* ===============================
       Z-INDEX MANAGEMENT

        .z-modal {

        }

<body>
    <!-- Global Loader -->
    <div id="global-loader">
        <div class="global-loader-logo">
            <img src="./img/ThreeDOS.jpg" alt="ThreeDOS Logo">
        </div>
        <div class="global-loader-text">ThreeDOS</div>
        <div class="global-loader-bar"></div>
    </div>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>🎓ThreeDOS Ushering</h2>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <span class="icon">👥</span> <span>Applicants</span> </a>
                <a href="calendar.html" class="nav-item active">
                    <span class="icon">📅</span> <span>Calendar</span> </a>
                <a href="statistics_page.html" class="nav-item">
                    <span class="icon">📊</span> <span>Statistics</span> </a>
                <a href="RegistrationForm.html" class="nav-item">
                    <span class="icon">➕</span> <span>New Registration</span> </a>
            </nav>
            <div class="stats-summary">
                <h3>Interviews Today</h3>
                <div class="stat-item">
                    <span class="stat-label">Scheduled</span>
                    <span class="stat-value" id="today-count">0</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1>Interview Calendar</h1>
                <div class="header-actions">
                    <div class="view-switcher">
                        <button class="view-btn active" onclick="switchView('weekly')">Weekly</button>
                        <button class="view-btn" onclick="switchView('daily')">Daily</button>
                    </div>
                    <button class="btn-refresh" onclick="fetchInterviews()"> <span>🔄</span> Refresh </button>
                </div>
            </header>

            <div class="calendar-container">
                <div class="calendar-header">
                    <div class="calendar-controls">
                        <button class="btn-page" onclick="changePeriod(-1)"> <i class="fas fa-chevron-left"></i>
                        </button>
                        <div class="current-period" id="current-period">January 2026</div>
                        <button class="btn-page" onclick="changePeriod(1)"> <i class="fas fa-chevron-right"></i>
                        </button>
                        <button class="btn-secondary" onclick="goToToday()">Today</button>
                    </div>
                </div>
                <div class="calendar-body" id="calendar-body">
                    <div class="loader-container" id="loader">
                        <span class="loader"></span>
                    </div>
                    <!-- Calendar grid will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Applicant Info Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Interview Details</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Data injected by JS -->
            </div>
            <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                <button class="btn-primary" id="view-details-btn" style="flex: 1;">View Full Profile</button>
                <button class="btn-secondary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>

        const API_URL = '../backend/api.php';
        const TOKEN = localStorage.getItem('usher_token');
        if (!TOKEN) window.location.href = 'login.html';

        let currentView = 'weekly';
        let currentDate = new Date();
        let interviews = [];

        // ENHANCED CONFIGURATION
        const CONFIG = {
            startHour: 8,
            endHour: 22, // 10 PM
            pixelsPerMinute: 5 // 75px per 15 min
        };

        async function fetchInterviews() {
            document.getElementById('loader').style.display = 'flex';
            try {
                const response = await fetch(`${API_URL}?interviews=1`, {
                    headers: { 'X-Token': TOKEN }
                });
                const result = await response.json();
                if (result.status === 'success') {
                    interviews = result.data.applicants || [];
                    renderCalendar();
                    updateTodayStats();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Fetch error:', error);
            } finally {
                document.getElementById('loader').style.display = 'none';
                hideGlobalLoader();
            }
        }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === view);
            });
            renderCalendar();
        }

        function changePeriod(delta) {
            if (currentView === 'weekly') {
                currentDate.setDate(currentDate.getDate() + (delta * 7));
            } else {
                currentDate.setDate(currentDate.getDate() + delta);
            }
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        function updateTodayStats() {
            const today = new Date().toISOString().split('T')[0];
            const count = interviews.filter(i => i.interview_time && i.interview_time.startsWith(today)).length;
            document.getElementById('today-count').innerText = count;
        }

        function renderCalendar() {
            const calendarBody = document.getElementById('calendar-body');
            const periodDisplay = document.getElementById('current-period');
            // Clear previous content
            calendarBody.innerHTML = '';

            if (currentView === 'weekly') {
                renderWeeklyView(calendarBody, periodDisplay);
            } else {
                renderDailyView(calendarBody, periodDisplay);
            }
        }

        // Helper: Format time as AM/PM
        function formatTime(h, m) {
            const ampm = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            const mStr = m.toString().padStart(2, '0');
            return `${h12}:${mStr} ${ampm}`;
        }

        // Helper: Generate Time Label HTML
        function getTimeLabel(h, m) {
            const timeStr = formatTime(h, m);
            // On the hour: Bold and brighter
            if (m === 0) {
                return `<span style="color: var(--text); font-weight: 700;">${timeStr}</span>`;
            }
            // 15-min intervals: Lighter
            return `<span style="color: var(--text-tertiary); font-size: 0.8em;">${timeStr}</span>`;
        }

        function renderWeeklyView(container, display) {
            const startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());

            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);

            display.innerText =
                `${startOfWeek.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} - 
                 ${endOfWeek.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;

            let html = `<div class="weekly-grid">
                <div class="grid-header time-col" style="display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px;">Time</div>`;

            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayDates = [];

            // Header Row
            for (let i = 0; i < 7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);
                dayDates.push(d.toISOString().split('T')[0]);
                const isToday = new Date().toISOString().split('T')[0] === dayDates[i];
                html += `<div class="grid-header ${isToday ? 'today' : ''}">
                            ${days[i]} <br> <span style="font-size:1.2em">${d.getDate()}</span>
                         </div>`;
            }

            // Time Column (Left Sidebar)
            html += `<div class="time-col">`;
            for (let h = CONFIG.startHour; h <= CONFIG.endHour; h++) {
                for (let m = 0; m < 60; m += 15) {
                    html += `<div class="hour-row" style="display:flex; align-items:center; justify-content:center;">${getTimeLabel(h, m)}</div>`;
                }
            }
            html += `</div>`;

            // Days Columns
            for (let i = 0; i < 7; i++) {
                html += `<div class="day-col">`;

                // Background Grid
                for (let h = CONFIG.startHour; h <= CONFIG.endHour; h++) {
                    for (let m = 0; m < 60; m += 15) {
                        const style = m === 0
                            ? 'border-top: 1px solid rgba(255,255,255,0.08);'
                            : 'border-top: 1px dotted rgba(255,255,255,0.03);';
                        html += `<div class="hour-row" style="${style}"></div>`;
                    }
                }

                // Events
                const events = interviews.filter(inv =>
                    inv.interview_time &&
                    inv.interview_time.startsWith(dayDates[i])
                );

                html += renderEventsForColumn(events);

                html += `</div>`; // End day-col
            }

            html += `</div>`; // End weekly-grid
            container.innerHTML = html;
        }

        function renderDailyView(container, display) {
            display.innerText = currentDate.toLocaleDateString(undefined, {
                weekday: 'long',
                month: 'long',
                day: 'numeric',
                year: 'numeric'
            });

            const dateStr = currentDate.toISOString().split('T')[0];

            let html = `<div class="daily-grid">`;

            // Time Column
            html += `<div class="time-col">`;
            for (let h = CONFIG.startHour; h <= CONFIG.endHour; h++) {
                for (let m = 0; m < 60; m += 15) {
                    html += `<div class="hour-row" style="display:flex; align-items:center; justify-content:center;">${getTimeLabel(h, m)}</div>`;
                }
            }
            html += `</div>`;

            // Day Column
            html += `<div class="day-col" style="min-height: 100%;">`; // Ensure it fills height
            for (let h = CONFIG.startHour; h <= CONFIG.endHour; h++) {
                for (let m = 0; m < 60; m += 15) {
                    const style = m === 0
                        ? 'border-top: 1px solid rgba(255,255,255,0.08);'
                        : 'border-top: 1px dotted rgba(255,255,255,0.03);';
                    html += `<div class="hour-row" style="${style}"></div>`;
                }
            }

            const events = interviews.filter(inv =>
                inv.interview_time &&
                inv.interview_time.startsWith(dateStr)
            );

            html += renderEventsForColumn(events);

            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderEventsForColumn(events) {
            let html = '';
            // Basic conflict handling: Group overlapping events
            const slots = {};

            events.forEach(inv => {
                const t = new Date(inv.interview_time);
                const h = t.getHours();
                const m = t.getMinutes();
                if (h < CONFIG.startHour || h > CONFIG.endHour) return;

                // Group by roughly the same start time (15 min block)
                const key = h * 60 + Math.floor(m / 15) * 15;
                if (!slots[key]) slots[key] = [];
                slots[key].push(inv);
            });

            Object.keys(slots).forEach(key => {
                const group = slots[key];
                const width = 100 / group.length;

                group.forEach((inv, index) => {
                    const t = new Date(inv.interview_time);
                    const h = t.getHours();
                    const m = t.getMinutes();

                    const top = ((h - CONFIG.startHour) * 60 + m) * CONFIG.pixelsPerMinute;

                    // Standard duration assumption (e.g. 20 mins) or fixed height
                    const height = 50;

                    html += `
                        <div class="event-card"
                            style="
                                top: ${top}px;
                                height: ${height}px;
                                width: calc(${width}% - 10px);
                                left: calc(${index * width}% + 5px);
                                z-index: ${10 + index};
                            "
                            onclick="showInterviewDetails(${JSON.stringify(inv).replace(/"/g, '&quot;')})">
                            <div class="event-title">${inv.name}</div>
                            <div class="event-time">
                                ${formatTime(h, m)}
                            </div>
                        </div>
                    `;
                });
            });
            return html;
        }

        function showInterviewDetails(interview) {
            const modal = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            const title = document.getElementById('modal-title');

            title.innerText = interview.name;
            const time = new Date(interview.interview_time);

            body.innerHTML = `
                <div class="modal-field">
                    <span class="modal-label">Council</span>
                    <div class="modal-value">${interview.council || 'Not Assigned'}</div>
                </div>
                <div class="modal-field">
                    <span class="modal-label">Time</span>
                    <div class="modal-value">${time.toDateString()} at ${formatTime(time.getHours(), time.getMinutes())}</div>
                </div>
                <div class="modal-field">
                    <span class="modal-label">Status</span>
                    <div class="modal-value">${interview.rating || 'Pending'}</div>
                </div>
            `;

            document.getElementById('view-details-btn').onclick = () => {
                window.location.href = `applicant_details_page.html?id=${interview.id}`;
            };

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Safety fallback: Hide loader after 10s max
            const safetyTimer = setTimeout(hideGlobalLoader, 10000);

            fetchInterviews().finally(() => {
                clearTimeout(safetyTimer);
                hideGlobalLoader();
            });
        });

        function hideGlobalLoader() {
            const globalLoader = document.getElementById('global-loader');
            if (globalLoader && !globalLoader.classList.contains('hidden')) {
                globalLoader.classList.add('hidden');
                setTimeout(() => globalLoader.style.display = 'none', 500);
            }
        }

        window.onclick = function (event) {
            const modal = document.getElementById('modal-overlay');
            if (event.target == modal) {
                closeModal();
            }
        }

    </script>
</body>

</html>
