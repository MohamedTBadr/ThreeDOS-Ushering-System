<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Management System - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>🎓 Ushering</h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-view="applicants">
                    <span class="icon">👥</span>
                    <span>Applicants</span>
                </a>
                <a href="#" class="nav-item" data-view="statistics">
                    <span class="icon">📊</span>
                    <span>Statistics</span>
                </a>
                <a href="RegsitrationForm.html" class="nav-item">
                    <span class="icon">➕</span>
                    <span>New Registration</span>
                </a>
            </nav>
            
            <div class="stats-summary">
                <h3>Quick Stats</h3>
                <div class="stat-item">
                    <span class="stat-label">Total</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
                <div class="stat-item acceptance">
                    <span class="stat-label">Accepted</span>
                    <span class="stat-value" id="stat-accepted">0</span>
                </div>
                <div class="stat-item backup">
                    <span class="stat-label">Backup (B)</span>
                    <span class="stat-value" id="stat-backup">0</span>
                </div>
                <div class="stat-item rejection">
                    <span class="stat-label">Rejected</span>
                    <span class="stat-value" id="stat-rejected">0</span>
                </div>
                <div class="stat-item pending">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value" id="stat-pending">0</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1>Applicant Management</h1>
                <div class="header-actions">
                    <button class="btn-refresh" onclick="loadApplicants()">
                        <span>🔄</span> Refresh
                    </button>
                </div>
            </header>

            <!-- Filters -->
            <div class="filters-section">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search" placeholder="Search by name, email, college...">
                </div>
                
                <select id="level-filter" class="filter-select">
                    <option value="">All Levels</option>
                    <option value="Level 1">Level 1</option>
                    <option value="Level 2">Level 2</option>
                    <option value="Level 3">Level 3</option>
                    <option value="Level 4">Level 4</option>
                </select>
                
                <select id="rating-filter" class="filter-select">
                    <option value="">All Ratings</option>
                    <option value="Pending">Pending</option>
                    <option value="Acceptance">Acceptance</option>
                    <option value="B">B (Backup)</option>
                    <option value="Rejection">Rejection</option>
                </select>
                
                <button class="btn-clear-filters" onclick="clearFilters()">Clear Filters</button>
            </div>

            <!-- Applicants Grid -->
            <div class="applicants-grid" id="applicants-grid">
                <!-- Cards will be inserted here -->
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button class="btn-page" id="btn-prev" onclick="previousPage()">
                    ← Previous
                </button>
                <span class="page-info" id="page-info">Page 1 of 1</span>
                <button class="btn-page" id="btn-next" onclick="nextPage()">
                    Next →
                </button>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Applicant</h2>
                <button class="btn-close" onclick="closeModal()">×</button>
            </div>
            <form id="edit-form" class="modal-body">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label for="edit-name">Name</label>
                    <input type="text" id="edit-name" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-email">Email</label>
                    <input type="email" id="edit-email" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-phone">Phone</label>
                    <input type="tel" id="edit-phone" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-college">College</label>
                    <input type="text" id="edit-college" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-level">Level</label>
                    <select id="edit-level" required>
                        <option value="Level 1">Level 1</option>
                        <option value="Level 2">Level 2</option>
                        <option value="Level 3">Level 3</option>
                        <option value="Level 4">Level 4</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="edit-preferences">Preferences</label>
                    <textarea id="edit-preferences" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="edit-rating">Rating</label>
                    <select id="edit-rating" required>
                        <option value="Pending">Pending</option>
                        <option value="Acceptance">Acceptance</option>
                        <option value="B">B (Backup)</option>
                        <option value="Rejection">Rejection</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="edit-notes">Notes</label>
                    <textarea id="edit-notes" rows="4" placeholder="Add internal notes about this applicant..."></textarea>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="js/dashboard.js"></script>
</body>
</html>
