<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login |ThreeDOS Ushering System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
            <link rel="icon" type="image/png" href="./img/ThreeDOS.jpg">

    <style>
:root {
    /* THREEDOS Brand System */
    --primary: #7F4797;
    --primary-dark: #6A3A82;
    --primary-light: #9A6BB2;

    --bg: #19191C;
    --card: #252429;

    --text: #F4F4F4;
    --text-muted: #9F9F9F;

    --border: #565657;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: radial-gradient(
        circle at top right,
        #252429,
        #19191C
    );
}

.login-card {
    background: var(--card);
    padding: 2.5rem;
    border-radius: 1.5rem;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    border: 1px solid var(--border);
}

h1 {
    margin-bottom: 0.5rem;
    font-size: 1.8rem;
}

p {
    color: var(--text-muted);
    margin-bottom: 2rem;
    font-size: 0.9rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
}

input {
    width: 100%;
    padding: 0.75rem 1rem;
    background: #19191C;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    color: var(--text);
    box-sizing: border-box;
    transition: border-color 0.3s, box-shadow 0.3s;
}

input::placeholder {
    color: #6F6F73;
}

input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(127, 71, 151, 0.35);
}

button {
    width: 100%;
    padding: 0.75rem;
    background: linear-gradient(
        135deg,
        var(--primary),
        var(--primary-dark)
    );
    color: white;
    border: none;
    border-radius: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(127, 71, 151, 0.45);
}

.error {
    color: #ef4444;
    font-size: 0.8rem;
    margin-top: 1rem;
    text-align: center;
    display: none;
}

    </style>
</head>
<body>
    <div class="login-card">
        <h1>Welcome Back</h1>
        <p>Enter your credentials to manage applicants.</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@council.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="submitBtn">Sign In</button>
            <div id="errorMsg" class="error"></div>
        </form>
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: #94a3b8;">
            Don't have an account? <a href="signup.html" style="color: #6366f1; text-decoration: none; font-weight: 600;">Sign Up</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const error = document.getElementById('errorMsg');
            
            btn.disabled = true;
            btn.innerText = 'Authenticating...';
            error.style.display = 'none';

            try {
                const res = await fetch('../backend/auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    localStorage.setItem('usher_token', data.data.token);
                    localStorage.setItem('user_role', data.data.role);
                    localStorage.setItem('user_council', data.data.council_name);
                    window.location.href = 'dashboard.html';
                } else {
                    error.innerText = data.message;
                    error.style.display = 'block';
                }
            } catch (err) {
                error.innerText = 'Connection error. Try again.';
                error.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Sign In';
            }
        });
    </script>
</body>
</html>
