<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreeDOS Applicant Management System - Statistics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./img/ThreeDOS.jpg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* =========================
   GLOBAL RESET
========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #19191C 0%, #252429 100%);
            color: #F4F4F4;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================
   DASHBOARD LAYOUT
========================= */
        .dashboard-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        /* =========================
   SIDEBAR
========================= */
        .sidebar {
            background: linear-gradient(180deg, #252429 0%, #19191C 100%);
            border-right: 1px solid #565657;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .logo h2 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #9A6BB2, #7F4797);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            color: #B0B0B0;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-item:hover {
            background: rgba(127, 71, 151, 0.15);
            color: #9A6BB2;
            transform: translateX(4px);
        }

        .nav-item.active {
            background: rgba(127, 71, 151, 0.25);
            color: #9A6BB2;
            border-left: 3px solid #7F4797;
        }

        .nav-item .icon {
            font-size: 1.25rem;
        }

        /* =========================
   MAIN CONTENT
========================= */
        .main-content {
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* =========================
   HEADER
========================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #F4F4F4;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .filters select,
        .filters input {
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            border: none;
            background: #1e1e2f;
            color: #F4F4F4;
        }

        /* =========================
   STATS CARDS
========================= */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #252429, #19191C);
            border: 1px solid #565657;
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35);
            border-color: #7F4797;
        }

        .stat-card h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #F4F4F4;
        }

        .stat-card p {
            color: #B0B0B0;
            font-weight: 500;
        }

        /* =========================
   TABLE
========================= */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #252429;
            border: 1px solid #565657;
            border-radius: 0.75rem;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        thead {
            background: #343338;
        }

        thead th {
            padding: 0.75rem 1rem;
            text-align: left;
            color: #F4F4F4;
        }

        tbody td {
            padding: 0.75rem 1rem;
            border-top: 1px solid #565657;
            color: #F4F4F4;
        }

        tbody tr:hover {
            background: rgba(127, 71, 151, 0.1);
        }

        /* =========================
   CHARTS
========================= */
        .chart-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .chart-box {
            background: linear-gradient(135deg, #252429, #19191C);
            border: 1px solid #565657;
            border-radius: 1rem;
            padding: 1rem;
            flex: 1;
            min-width: 300px;
        }

        /* =========================
   BUTTONS
========================= */
        button {
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-refresh,
        .btn-export {
            background: rgba(127, 71, 151, 0.15);
            border: 1px solid #7F4797;
            color: #9A6BB2;
        }

        .btn-refresh:hover,
        .btn-export:hover {
            background: #7F4797;
            color: #fff;
            box-shadow: 0 6px 18px rgba(127, 71, 151, 0.4);
            transform: translateY(-2px);
        }

        /* =========================
   RESPONSIVE
========================= */
        /* Tablets and smaller laptops (1024px and below) */
        @media (max-width:1024px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #565657;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .chart-container {
                flex-direction: column;
            }

            .chart-box {
                min-width: 100%;
            }
        }

        /* Tablets (768px and below) */
        @media (max-width:768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .stat-card {
                padding: 1rem;
            }

            .stat-card h2 {
                font-size: 1.5rem;
            }

            /* Make table scrollable horizontally */
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            thead,
            tbody,
            tr {
                display: table;
                width: 100%;
                table-layout: fixed;
            }

            .chart-box {
                padding: 0.75rem;
            }

            .main-content {
                padding: 1.5rem;
            }
        }

        /* Mobile devices (480px and below) */
        @media (max-width:480px) {
            .main-content {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .header>div {
                width: 100%;
                display: flex;
                gap: 0.5rem;
            }

            .btn-refresh,
            .btn-export {
                flex: 1;
                padding: 0.75rem 0.5rem;
                font-size: 0.875rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .stat-card {
                padding: 0.875rem;
            }

            .stat-card h2 {
                font-size: 1.25rem;
            }

            .stat-card p {
                font-size: 0.875rem;
            }

            /* Stack table cells vertically on very small screens */
            table {
                font-size: 0.875rem;
            }

            thead th,
            tbody td {
                padding: 0.5rem;
            }

            .chart-box {
                padding: 0.5rem;
            }

            .sidebar {
                padding: 1rem;
            }

            .logo h2 {
                font-size: 1.25rem;
            }

            .nav-item {
                padding: 0.75rem;
                font-size: 0.875rem;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>ThreeDOS'26</h2>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item" data-view="applicants">
                    <span class="icon">👥</span>
                    <span>Applicants</span>
                </a>
                <a href="statistics_page.html" class="nav-item active" data-view="statistics">
                    <span class="icon">📊</span>
                    <span>Statistics</span>
                </a>
                <a href="RegistrationForm.html" class="nav-item">
                    <span class="icon">➕</span>
                    <span>New Registration</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1>Statistics Overview</h1>
                <div>
                    <button class="btn-refresh" onclick="loadStatistics()">🔄 Refresh</button>
                    <button class="btn-export" onclick="exportCSV()">📥 Export CSV</button>
                </div>
            </header>



            <!-- Quick Stats Cards -->
            <div class="stats-grid" id="stats-grid"></div>

            <!-- Charts -->
            <div class="chart-container">
                <div class="chart-box"><canvas id="ratingChart"></canvas></div>
                <div class="chart-box"><canvas id="levelChart"></canvas></div>
                <div class="chart-box"><canvas id="councilChart"></canvas></div>
            </div>

            <!-- Detailed Table -->
            <table id="stats-table">
                <thead>
                    <tr>
                        <th>Level</th>
                        <th>Council</th>
                        <th>Total Applicants</th>
                        <th>Pending</th>
                        <th>Accepted</th>
                        <th>Backup (B)</th>
                        <th>Rejected</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </main>
    </div>

    <script>
        const API_URL = '../backend/api.php';
        const TOKEN = localStorage.getItem('usher_token');
        if (!TOKEN) window.location.href = 'login.html';

        let ratingChart, levelChart, councilChart;
        let allApplicants = []; // Store all applicants for CSV export

        async function loadStatistics() {
            const grid = document.getElementById('stats-grid');
            const tableBody = document.querySelector('#stats-table tbody');

            const ratingFilter = document.getElementById('rating-filter');

            grid.innerHTML = '<div>Loading statistics...</div>';
            tableBody.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}?quickstats=1`, { headers: { 'X-Token': TOKEN } });
                const result = await response.json();
                if (result.status !== 'success') { alert(result.message); return; }

                const stats = result.data;

                // ===============================
                // Fetch ALL applicants using cursor-based pagination
                // ===============================
                allApplicants = [];
                let cursor = null;
                let hasMore = true;

                while (hasMore) {
                    let url = `${API_URL}?limit=100`; // Fetch 100 at a time
                    if (cursor) {
                        url += `&cursor=${cursor}`;
                    }

                    const applicantsResponse = await fetch(url, { headers: { 'X-Token': TOKEN } });
                    const applicantsResult = await applicantsResponse.json();

                    if (applicantsResult.status !== 'success') {
                        alert(applicantsResult.message);
                        break;
                    }

                    const batch = applicantsResult.data.applicants;
                    allApplicants = allApplicants.concat(batch);

                    hasMore = applicantsResult.data.has_more;
                    cursor = applicantsResult.data.next_cursor;

                    // Update loading indicator
                    grid.innerHTML = `<div>Loading statistics... (${allApplicants.length} records loaded)</div>`;
                }

                let applicants = allApplicants; // Use all fetched applicants



                // Quick stats cards
                const ratingMap = { Pending: 0, Acceptance: 0, B: 0, Rejection: 0 };
                applicants.forEach(a => { ratingMap[a.rating || 'Pending']++; });
                grid.innerHTML = `
            <div class="stat-card"><h2>${applicants.length}</h2><p>Total Applicants</p></div>
            <div class="stat-card"><h2>${ratingMap.Acceptance}</h2><p>Accepted</p></div>
            <div class="stat-card"><h2>${ratingMap.B}</h2><p>Backup (B)</p></div>
            <div class="stat-card"><h2>${ratingMap.Rejection}</h2><p>Rejected</p></div>
            <div class="stat-card"><h2>${ratingMap.Pending}</h2><p>Pending</p></div>
        `;



                // Aggregate data for table & charts
                const tableMap = {};
                const levelMap = {};
                const councilMap = {};
                applicants.forEach(a => {
                    const lvl = a.level;
                    const c = a.council;
                    const r = a.rating || 'Pending';

                    // Table aggregation (level + council)
                    const key = `${lvl}_${c}`;
                    if (!tableMap[key]) tableMap[key] = { total: 0, Pending: 0, Acceptance: 0, B: 0, Rejection: 0, level: lvl, council: c };
                    tableMap[key].total++; tableMap[key][r]++;

                    // Level chart
                    if (!levelMap[lvl]) levelMap[lvl] = { Pending: 0, Acceptance: 0, B: 0, Rejection: 0 };
                    levelMap[lvl][r]++;

                    // Council chart
                    if (!councilMap[c]) councilMap[c] = { Pending: 0, Acceptance: 0, B: 0, Rejection: 0 };
                    councilMap[c][r]++;
                });

                // Populate table
                tableBody.innerHTML = '';
                Object.values(tableMap).forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${row.level}</td><td>${row.council}</td><td>${row.total}</td><td>${row.Pending}</td><td>${row.Acceptance}</td><td>${row.B}</td><td>${row.Rejection}</td>`;
                    tableBody.appendChild(tr);
                });

                // Rating chart
                if (ratingChart) ratingChart.destroy();
                const ctxR = document.getElementById('ratingChart').getContext('2d');
                ratingChart = new Chart(ctxR, {
                    type: 'pie',
                    data: {
                        labels: Object.keys(ratingMap),
                        datasets: [{ data: Object.values(ratingMap), backgroundColor: ['#F0AD4E', '#5CB85C', '#5BC0DE', '#D9534F'] }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                });

                // Level chart
                if (levelChart) levelChart.destroy();
                const ctxL = document.getElementById('levelChart').getContext('2d');
                levelChart = new Chart(ctxL, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(levelMap),
                        datasets: [
                            { label: 'Pending', data: Object.values(levelMap).map(l => l.Pending), backgroundColor: '#F0AD4E' },
                            { label: 'Accepted', data: Object.values(levelMap).map(l => l.Acceptance), backgroundColor: '#5CB85C' },
                            { label: 'Backup', data: Object.values(levelMap).map(l => l.B), backgroundColor: '#5BC0DE' },
                            { label: 'Rejected', data: Object.values(levelMap).map(l => l.Rejection), backgroundColor: '#D9534F' },
                        ]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
                });

                // Council chart
                if (councilChart) councilChart.destroy();
                const ctxC = document.getElementById('councilChart').getContext('2d');
                councilChart = new Chart(ctxC, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(councilMap),
                        datasets: [
                            { label: 'Pending', data: Object.values(councilMap).map(c => c.Pending), backgroundColor: '#F0AD4E' },
                            { label: 'Accepted', data: Object.values(councilMap).map(c => c.Acceptance), backgroundColor: '#5CB85C' },
                            { label: 'Backup', data: Object.values(councilMap).map(c => c.B), backgroundColor: '#5BC0DE' },
                            { label: 'Rejected', data: Object.values(councilMap).map(c => c.Rejection), backgroundColor: '#D9534F' },
                        ]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
                });

            } catch (err) { console.error(err); alert('Failed to load statistics'); }
        }

        // Export all applicant records to CSV
        function exportCSV() {
            if (!allApplicants || allApplicants.length === 0) {
                alert('No applicant data available to export. Please refresh the statistics first.');
                return;
            }

            // Define CSV headers
            const headers = ['ID', 'Name', 'Email', 'Phone', 'College', 'Level', 'Council/Preference', 'Rating', 'Interviewer'];

            // Convert applicants to CSV rows
            const rows = allApplicants.map(app => [
                app.id || '',
                app.name || '',
                app.email || '',
                app.phone || '',
                app.college || '',
                app.level || '',
                app.council || '',
                app.rating || 'Pending',
                app.interviewed_by || 'N/A'
            ]);

            // Escape CSV values (handle commas and quotes)
            const escapeCSV = (value) => {
                const str = String(value);
                if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                    return `"${str.replace(/"/g, '""')}"`;
                }
                return str;
            };

            // Build CSV content
            const csvContent = [
                headers.map(escapeCSV).join(','),
                ...rows.map(row => row.map(escapeCSV).join(','))
            ].join('\n');

            // Create and download CSV file
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const timestamp = new Date().toISOString().split('T')[0]; // YYYY-MM-DD format
            a.href = url;
            a.download = `ThreeDOS_Applicants_${timestamp}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }



        // Load on page load
        document.addEventListener('DOMContentLoaded', loadStatistics);
    </script>
</body>

</html>
