<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreeDOS Interview Calendar</title>
    <link rel="icon" type="image/png" href="./img/ThreeDOS.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7F4797;
            --primary-light: #9A6BB2;
            --bg-dark: #19191C;
            --bg-card: #252429;
            --dark-lighter: #343338;
            --border: #565657;
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8f8fa;
            --text-secondary: #B0B0B0;
            --sidebar-width: 280px;
            --row-height: 75px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===============================
       LUXURY MODAL - Glassmorphism
    =============================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(20px) saturate(180%);
            animation: overlayFadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2rem;
        }

        @keyframes overlayFadeIn {
            from {
                opacity: 0;
                backdrop-filter: blur(0);
            }

            to {
                opacity: 1;
                backdrop-filter: blur(20px);
            }
        }

        .modal-content {
            background: linear-gradient(145deg,
                    rgba(26, 26, 32, 0.95),
                    rgba(15, 15, 19, 0.98));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
            box-shadow:
                var(--shadow-lg),
                0 0 100px rgba(127, 71, 151, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: modalSlideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%,
                    rgba(127, 71, 151, 0.1) 0%,
                    transparent 50%);
            pointer-events: none;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            position: relative;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), transparent);
            border-radius: 3px;
        }

        .modal-body {
            position: relative;
            z-index: 1;
        }

        .modal-field {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .modal-field:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(127, 71, 151, 0.3);
            transform: translateX(4px);
        }

        .modal-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .modal-value {
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 700;
            word-break: break-word;
            line-height: 1.4;
        }

        .close-modal {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            font-size: 1.8rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
        }

        .close-modal:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            transform: rotate(90deg) scale(1.1);
            box-shadow: var(--shadow-primary);
            border-color: var(--primary);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-card) 100%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .dashboard-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            position: relative;
        }

        /* ---------------- SIDEBAR ---------------- */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-dark) 100%);
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 2000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .close-sidebar-btn {
            display: none;
        }

        .header-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1rem;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .org-name {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .org-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(127, 71, 151, 0.15);
            color: var(--primary-light);
        }

        .nav-item.active {
            border-left: 3px solid var(--primary);
        }

        .nav-item .icon {
            font-size: 1.2rem;
        }

        .stats-summary {
            background: rgba(127, 71, 151, 0.08);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.25rem;
            margin-top: auto;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.5rem 0;
            font-size: 0.9rem;
        }

        .stat-item:last-child {
            border: none;
        }

        .stat-value {
            font-weight: 700;
            color: #fff;
        }

        /* ---------------- MAIN CONTENT ---------------- */
        .main-content {
            flex: 1;
            padding: 2rem;
            min-width: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.8rem;
            cursor: pointer;
            margin-right: 0.5rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 10px;
            font-family: inherit;
        }

        .btn-refresh {
            background: rgba(127, 71, 151, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary-light);
            padding: 0.6rem 1rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-refresh:hover {
            background: var(--primary);
            color: #fff;
        }

        .view-switcher {
            display: flex;
            background: var(--dark-lighter);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .view-btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            background: transparent;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* ---------------- CALENDAR ---------------- */
        .calendar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            min-height: 0;
        }

        .calendar-header {
            padding: 1rem;
            background: var(--dark-lighter);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .calendar-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .current-period {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            min-width: 150px;
            text-align: center;
        }

        .btn-icon,
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }

        .btn-icon:hover,
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .calendar-body {
            flex: 1;
            overflow: auto;
            position: relative;
            scroll-behavior: smooth;
        }

        /* GRID SYSTEM */
        .weekly-grid {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            min-width: 900px;
        }

        .daily-grid {
            display: grid;
            grid-template-columns: 60px 1fr;
            width: 100%;
        }

        .grid-header {
            position: sticky;
            top: 0;
            background: var(--dark-lighter);
            z-index: 50;
            border-bottom: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            text-align: center;
            padding: 1rem 0.5rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .grid-header.today {
            color: var(--primary-light);
            background: rgba(127, 71, 151, 0.1);
        }

        .time-col {
            position: sticky;
            left: 0;
            z-index: 60;
            background: var(--dark-lighter);
            border-right: 1px solid var(--glass-border);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .day-col {
            border-right: 1px solid var(--glass-border);
            position: relative;
            background: repeating-linear-gradient(to bottom, transparent, transparent 74px, rgba(255, 255, 255, 0.05) 75px);
        }

        .hour-row {
            height: var(--row-height);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .event-card {
            position: absolute;
            background: linear-gradient(135deg, rgba(127, 71, 151, 0.9), rgba(105, 56, 133, 0.9));
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
            color: #fff;
            overflow: hidden;
            border-left: 3px solid var(--primary-light);
            cursor: pointer;
            z-index: 10;
        }

        .event-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================
            LOADER
        ========================= */
        #global-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-card) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        #global-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .global-loader-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--bg-card);
            box-shadow: 0 0 0 4px rgba(127, 71, 151, 0.2), 0 0 40px rgba(127, 71, 151, 0.4);
            overflow: hidden;
            animation: logoPulse 2s infinite ease-in-out;
        }

        .global-loader-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes logoPulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 4px rgba(127, 71, 151, 0.2);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 8px rgba(127, 71, 151, 0.3);
            }
        }

        .global-loader-text {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-main);
            background: linear-gradient(90deg, #9A6BB2, #FF6B8B, #9A6BB2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: textShimmer 3s linear infinite;
        }

        .global-loader-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .global-loader-bar::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 40%;
            background: #7F4797;
            border-radius: 4px;
            box-shadow: 0 0 10px #7F4797;
            animation: barLoading 1.5s ease-in-out infinite;
        }

        @keyframes textShimmer {
            to {
                background-position: 200% center;
            }
        }

        @keyframes barLoading {
            0% {
                left: -40%;
            }

            50% {
                left: 40%;
                width: 60%;
            }

            100% {
                left: 100%;
                width: 40%;
            }
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #252429;
            padding: 1.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--glass-border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .btn-full {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 0.8rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        /* Sidebar Overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1500;
            backdrop-filter: blur(2px);
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .close-sidebar-btn {
                display: block;
                position: absolute;
                top: 1rem;
                right: 1rem;
                background: none;
                border: none;
                color: var(--text-secondary);
                font-size: 1.5rem;
                cursor: pointer;
                padding: 10px;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .weekly-grid {
                min-width: 700px;
                grid-template-columns: 50px repeat(7, 1fr);
            }
        }

        @media (max-width: 480px) {
            .btn-refresh {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Loader -->
    <div id="global-loader">
        <div class="global-loader-logo">
            <img src="./img/ThreeDOS.jpg" alt="ThreeDOS Logo">
        </div>
        <div class="global-loader-text">ThreeDOS</div>
        <div class="global-loader-bar"></div>
    </div>

    <div class="dashboard-container">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <button class="close-sidebar-btn" onclick="closeSidebar()">✖</button>

            <div class="header-logo">
                <div class="logo-container">
                    <img src="./img/ThreeDOS.jpg" alt="Logo" class="logo-img">
                </div>
                <div class="org-name">ThreeDOS</div>
                <div class="org-subtitle">Academic Councils</div>
            </div>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item"><span class="icon">👥</span> Applicants</a>
                <a href="calendar.html" class="nav-item active"><span class="icon">📅</span> Calendar</a>
                <a href="statistics_page.html" class="nav-item"><span class="icon">📊</span> Statistics</a>
                <a href="RegistrationForm.html" class="nav-item"><span class="icon">➕</span> New Registration</a>
            </nav>

            <div class="stats-summary">
                <div class="stat-item">
                    <span>Scheduled Today</span>
                    <span class="stat-value" id="today-count">0</span>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content">
            <header class="header">
                <div style="display:flex; align-items:center;">
                    <button class="menu-toggle" onclick="openSidebar()">☰</button>
                    <h1>Interview Calendar</h1>
                </div>
                <div class="header-actions">
                    <div class="view-switcher">
                        <button class="view-btn active" onclick="switchView('weekly')">Weekly</button>
                        <button class="view-btn" onclick="switchView('daily')">Daily</button>
                    </div>
                    <button class="btn-refresh" onclick="fetchInterviews()">🔄 Refresh</button>
                </div>
            </header>

            <div class="calendar-wrapper" id="calendar-container">
                <div class="calendar-header">
                    <div class="calendar-controls">
                        <button class="btn-icon" onclick="changePeriod(-1)"><i class="fas fa-chevron-left"></i></button>
                        <div class="current-period" id="current-period">Loading...</div>
                        <button class="btn-icon" onclick="changePeriod(1)"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <button class="btn-secondary" onclick="goToToday()">Today</button>
                </div>
                <div class="calendar-body" id="calendar-body"></div>
            </div>
        </main>
    </div>


    <!-- Applicant Info Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Interview Details</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Data injected by JS -->
            </div>
            <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                <button class="btn-primary" id="view-details-btn" style="flex: 1;">View Full Profile</button>
                <button class="btn-secondary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // ================= SIDEBAR =================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        function openSidebar() { sidebar.classList.add('active'); overlay.classList.add('active'); }
        function closeSidebar() { sidebar.classList.remove('active'); overlay.classList.remove('active'); }
        overlay.addEventListener('click', closeSidebar);

        // ================= CALENDAR =================
        const API_URL = '../backend/api.php';
        const TOKEN = localStorage.getItem('usher_token');
        if (!TOKEN) window.location.href = 'register.html';

        let currentView = 'weekly';
        let currentDate = new Date();
        let interviews = [];
        const CONFIG = { startHour: 8, endHour: 22, slotMinutes: 15, slotHeight: 75 };

        function formatTime(h, m) { const ampm = h >= 12 ? 'PM' : 'AM'; const h12 = h % 12 || 12; return `${h12}:${m.toString().padStart(2, '0')} ${ampm}`; }
        function isSameDate(d1, d2) { return d1.toDateString() === d2.toDateString(); }

        async function fetchInterviews() {
            try {
                const res = await fetch(`${API_URL}?interviews=1`, { headers: { 'X-Token': TOKEN } });
                if (res.status === 401) window.location.href = 'register.html';
                const data = await res.json();
                if (data.status === 'success') {
                    interviews = data.data.interviews.map(i => {
                        i.interview_time = i.interview_time && i.interview_time !== '0000-00-00 00:00:00' ? new Date(i.interview_time) : null;
                        return i;
                    });
                    renderCalendar(); updateTodayStats();
                }
            } catch (e) { console.error(e); }
            finally { hideGlobalLoader(); }
        }

        function switchView(view) { currentView = view; document.querySelectorAll('.view-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.toLowerCase() === view)); renderCalendar(); }
        function changePeriod(delta) { currentView === 'weekly' ? currentDate.setDate(currentDate.getDate() + delta * 7) : currentDate.setDate(currentDate.getDate() + delta); renderCalendar(); }
        function goToToday() { currentDate = new Date(); renderCalendar(); }
        function updateTodayStats() { document.getElementById('today-count').innerText = interviews.filter(i => i.interview_time && isSameDate(i.interview_time, new Date())).length; }

        function renderCalendar() {
            const container = document.getElementById('calendar-body');
            const display = document.getElementById('current-period');
            container.innerHTML = '';
            currentView === 'weekly' ? renderWeeklyView(container, display) : renderDailyView(container, display);
        }

        function renderWeeklyView(container, display) {
            const startOfWeek = new Date(currentDate); startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());
            const endOfWeek = new Date(startOfWeek); endOfWeek.setDate(startOfWeek.getDate() + 6);
            display.innerText = `${startOfWeek.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} - ${endOfWeek.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;

            let html = `<div class="weekly-grid"><div class="grid-header time-col" style="display:flex;align-items:flex-end;justify-content:center">Time</div>`;
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; const dayDates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(startOfWeek); d.setDate(startOfWeek.getDate() + i); dayDates.push(d);
                const today = isSameDate(new Date(), d);
                html += `<div class="grid-header ${today ? 'today' : ''}">${days[i]}<br><span>${d.getDate()}</span></div>`;
            }

            // Time Column 15-min intervals
            html += `<div class="time-col">`;
            for (let h = CONFIG.startHour; h < CONFIG.endHour; h++) {
                for (let m = 0; m < 60; m += CONFIG.slotMinutes) {
                    html += `<div class="hour-row" style="height:75px">${formatTime(h, m)}</div>`;
                }
            }
            html += `</div>`;

            for (let i = 0; i < 7; i++) {
                html += `<div class="day-col" style="position:relative">`;
                for (let h = CONFIG.startHour; h < CONFIG.endHour; h++) {
                    for (let m = 0; m < 60; m += 15) {
                        html += `<div style="height:75px;border-bottom:1px solid rgba(255,255,255,0.05)"></div>`;
                    }
                }
                const events = interviews.filter(inv => inv.interview_time && isSameDate(inv.interview_time, dayDates[i]));
                html += renderEventsForColumn(events);
                html += `</div>`;
            }
            html += `</div>`; container.innerHTML = html;
        }

        function renderDailyView(container, display) {
            display.innerText = currentDate.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
            let html = `<div class="daily-grid"><div class="time-col">`;
            for (let h = CONFIG.startHour; h < CONFIG.endHour; h++) {
                for (let m = 0; m < 60; m += CONFIG.slotMinutes) {
                    html += `<div class="hour-row" style="height:${CONFIG.slotHeight}px">${formatTime(h, m)}</div>`;
                }
            }
            html += `</div><div class="day-col" style="position:relative">`;
            for (let h = CONFIG.startHour; h < CONFIG.endHour; h++) {
                for (let m = 0; m < 60; m += CONFIG.slotMinutes) {
                    html += `<div style="height:${CONFIG.slotHeight}px;border-bottom:1px solid rgba(255,255,255,0.05)"></div>`;
                }
            }
            const events = interviews.filter(inv => inv.interview_time && isSameDate(inv.interview_time, currentDate));
            html += renderEventsForColumn(events); html += `</div></div>`; container.innerHTML = html;
        }

        function renderEventsForColumn(events) {
            let html = '';
            events.forEach(inv => {
                const h = inv.interview_time.getHours();
                const m = inv.interview_time.getMinutes();
                if (h < CONFIG.startHour || h >= CONFIG.endHour) return;
                const totalMinutes = ((h - CONFIG.startHour) * 60) + m;
                const top = (totalMinutes / CONFIG.slotMinutes) * CONFIG.slotHeight;
                html += `<div class="event-card" style="top:${top}px;height:50px;width:90%;left:5%" onclick="showInterviewDetails(${inv.id})"><div class="event-title">${inv.name}</div><div style="font-size:0.7em;opacity:0.8">${formatTime(h, m)}</div></div>`;
            });
            return html;
        }

        function showInterviewDetails(id) {
            const interview = interviews.find(i => i.id == id); if (!interview) return;
            document.getElementById('modal-title').innerText = interview.name;
            const time = interview.interview_time;
            document.getElementById('modal-body').innerHTML = `
        <div style="margin-bottom:10px;color:#bbb;">Council: <span style="color:white">${interview.council || 'None'}</span></div>
        <div style="margin-bottom:10px;color:#bbb;">Time: <span style="color:white">${time ? formatTime(time.getHours(), time.getMinutes()) : '-'}</span></div>
        <div style="margin-bottom:10px;color:#bbb;">Status: <span style="color:white">${interview.rating || 'Pending'}</span></div>`;
            document.getElementById('view-details-btn').onclick = () => { window.location.href = `applicant_details_page.html?id=${interview.id}`; };
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
        function hideGlobalLoader() { document.getElementById('global-loader').classList.add('hidden'); }

        document.addEventListener('DOMContentLoaded', () => { fetchInterviews(); setTimeout(hideGlobalLoader, 1000); });
    </script>
</body>

</html>
